name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the DMG
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode"
          xcodebuild -version

      # CI has no certificate, so package.sh signs ad hoc. The site explains how to open it.
      - name: Package
        run: DEVELOPER_DIR=$(xcode-select -p) scripts/package.sh

      - name: Check the tag matches the app's version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release/NotAnIsland.app/Contents/Info.plist)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app's version $version. Update MARKETING_VERSION or the tag."
            exit 1
          fi

      # Installed copies read releases/latest/download/appcast.xml and install only DMGs signed with this key.
      - name: Sign the update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is missing."
            exit 1
          fi
          cp build/NotAnIsland-*.dmg build/NotAnIsland.dmg
          scripts/appcast.sh build/Build/Products/Release/NotAnIsland.app build/NotAnIsland.dmg \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/NotAnIsland.dmg" > build/appcast.xml
          cat build/appcast.xml

      # The website links to releases/latest/download/NotAnIsland.dmg, so the name never changes.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/NotAnIsland.dmg build/appcast.xml \
            --title "Not an Island ${GITHUB_REF_NAME#v}" \
            --generate-notes
