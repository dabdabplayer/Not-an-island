name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the DMG
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode"
          xcodebuild -version

      # CI has no certificate, so package.sh signs ad hoc. The site explains how to open it.
      - name: Package
        run: DEVELOPER_DIR=$(xcode-select -p) scripts/package.sh

      - name: Check the tag matches the app's version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Build/Products/Release/NotAnIsland.app/Contents/Info.plist)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app's version $version. Update MARKETING_VERSION or the tag."
            exit 1
          fi

      # The website links to releases/latest/download/NotAnIsland.dmg, so the name never changes.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/NotAnIsland-*.dmg build/NotAnIsland.dmg
          gh release create "$GITHUB_REF_NAME" build/NotAnIsland.dmg \
            --title "Not an Island ${GITHUB_REF_NAME#v}" \
            --generate-notes
