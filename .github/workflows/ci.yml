name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an unfinished run pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode"
          xcodebuild -version

      - name: Build and run tests
        run: |
          xcodebuild test \
            -project NotAnIsland.xcodeproj \
            -scheme NotAnIsland \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          retention-days: 7
